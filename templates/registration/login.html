{% extends "base.html" %}
{% block title %}Log in · {{ site.brand_name }}{% endblock %}
{% block content %}
<section class="auth"><div class="auth-box">
  <h1>Welcome back</h1><p class="muted">Log in to see saved trips and your booking history.</p>
  <form method="post" novalidate>{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}">
    {{ form.non_field_errors }}
    <label class="fl"><span>Email</span>{{ form.username }}{{ form.username.errors }}</label>
    <label class="fl"><span>Password</span>{{ form.password }}{{ form.password.errors }}</label>
    <button class="btn btn-sun block" type="submit">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div></section>
{% endblock %}
