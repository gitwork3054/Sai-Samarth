name: Repair Ayodhya illustrated itinerary cover
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pypdf requests
      - name: Fetch, verify, and catalogue scenic Ayodhya cover
        run: python scripts/repair_ayodhya_pdf_cover.py
      - name: Verify all route-city covers and PDF downloads
        run: python manage.py test travel.test_cinematic_pdf --verbosity 1
      - name: Save reviewed Ayodhya image and attribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/img/pdf_destinations/ayodhya.jpg travel/data/pdf_destination_photos.json
          if ! git diff --staged --quiet; then
            git commit -m "Replace Ayodhya PDF cover with licensed Sarayu River image"
            git push
          fi
