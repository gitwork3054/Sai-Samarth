name: Render cinematic PDF visual QA
on:
  push:
    paths:
      - 'scripts/build_pdf_qa_preview.py'
      - '.github/workflows/pdf-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pymupdf
      - run: python manage.py migrate --noinput
      - run: python scripts/build_pdf_qa_preview.py
      - name: Commit image-only QA preview on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/itinerary-design-qa.png
          if ! git diff --staged --quiet; then
            git commit -m 'QA: render cinematic itinerary cover and page previews'
            git push
          fi
