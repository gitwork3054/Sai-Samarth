name: Search CC-licensed scenic destination cover candidates
on:
  push:
    branches:
      - 'audit/destination-pdf-cover-images'
    paths:
      - 'scripts/find_scenic_pdf_cover_candidates.py'
      - '.github/workflows/find-scenic-pdf-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests beautifulsoup4
      - run: python scripts/find_scenic_pdf_cover_candidates.py
      - name: Publish candidate previews for manual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf-photo-candidates/
          if ! git diff --staged --quiet; then
            git commit -m "QA: licensed scenic cover candidates for visual selection"
            git push
          fi
