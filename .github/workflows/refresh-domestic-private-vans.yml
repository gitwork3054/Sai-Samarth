name: Refresh factual domestic private-van catalogue
on:
  push:
    paths:
      - 'scripts/snapshot_domestic_private_vans.py'
      - '.github/workflows/refresh-domestic-private-vans.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install factual extractor dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect factual supplier records (never full descriptions)
        run: python scripts/snapshot_domestic_private_vans.py --min-records 12 --workers 6
      - name: Commit verified domestic catalogue snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel/data/flamingo_domestic_private_vans.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh sourced Indian domestic private-van catalogue facts"
            git push
          fi
