name: Refresh factual domestic private-van catalogue
on:
  push:
    paths:
      - 'scripts/snapshot_domestic_private_vans.py'
      - 'travel/management/commands/import_flamingo_domestic_private.py'
      - 'travel/test_private_van_import.py'
      - '.github/workflows/refresh-domestic-private-vans.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install factual extractor dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect factual supplier records (never full descriptions)
        run: python scripts/snapshot_domestic_private_vans.py --min-records 12 --workers 6
      - name: Validate Django catalogue importer and independent itineraries
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py import_flamingo_domestic_private --min-records 60 --dry-run
          python manage.py test travel.test_private_van_import --verbosity 1
          python manage.py migrate --noinput
          python manage.py generate_demo
          python manage.py import_flamingo_domestic_private --min-records 60
          python manage.py shell -c 'from travel.models import Package; assert Package.objects.filter(source_details__catalogue_kind="domestic_private_van",is_active=True).count() >= 60, "Imported count too small"; assert not Package.objects.filter(destination__region="domestic",tour_type="individual",overview__icontains="This is a demo description:",is_active=True).exists(), "Demo individual tours still visible"; print("FULL INTEGRATION VALIDATION PASSED: private-van tours active, demo individual tours removed")'
      - name: Commit verified domestic catalogue snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel/data/flamingo_domestic_private_vans.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh sourced Indian domestic private-van catalogue facts"
            git push
          fi
