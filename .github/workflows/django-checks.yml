name: Django quality gate

on:
  push:
    branches:
      - main
      - feature/immersive-travel-storytelling
  pull_request:
    branches:
      - main

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compile
        run: python -m compileall -q accounts config travel
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Django tests
        run: python manage.py test --verbosity 1
      - name: Static asset collection
        run: python manage.py collectstatic --noinput
