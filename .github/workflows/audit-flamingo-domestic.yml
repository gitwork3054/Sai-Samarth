name: Audit Flamingo domestic catalogue discovery
on:
  push:
    paths:
      - '.github/workflows/audit-flamingo-domestic.yml'
      - 'scripts/audit_flamingo_domestic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/audit_flamingo_domestic.py
