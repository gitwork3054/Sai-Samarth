name: Install visually approved and licensed PDF covers
on:
  push:
    branches:
      - 'audit/destination-pdf-cover-images'
    paths:
      - 'scripts/install_reviewed_pdf_covers.py'
      - '.github/workflows/install-reviewed-pdf-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow beautifulsoup4
      - run: python scripts/install_reviewed_pdf_covers.py
      - name: Commit checked original photo assets and licence attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/pdf_destinations travel/data/pdf_destination_photos.json
          if ! git diff --staged --quiet; then
            git commit -m "Replace unsuitable PDF destination covers with verified scenic photos"
            git push
          fi
