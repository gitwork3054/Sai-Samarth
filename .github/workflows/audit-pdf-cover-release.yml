name: Visually verify destination-specific PDF covers
on:
  push:
    branches:
      - 'audit/destination-pdf-cover-images'
    paths:
      - 'scripts/audit_pdf_cover_release.py'
      - '.github/workflows/audit-pdf-cover-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pymupdf
      - run: python manage.py migrate --noinput
      - run: python scripts/audit_pdf_cover_release.py
      - name: Commit QA cover image preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf-photo-audit/final-cover-pdfs.jpg
          if ! git diff --staged --quiet; then
            git commit -m "QA: rendered approved destination itinerary PDF covers"
            git push
          fi
