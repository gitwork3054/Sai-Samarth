name: Review illustrated travel PDF hero covers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF rendering packages
        run: python -m pip install -r requirements.txt pymupdf
      - run: python manage.py migrate --noinput
      - name: Verify photo-backed typography, branded patterns and cover overlay
        run: python scripts/qa_pdf_covers.py
      - name: Save six-destination visual QA snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/illustrated-cover-qa.jpg
          if ! git diff --staged --quiet; then
            git commit -m "QA: preview illustrated six-destination PDF covers"
            git push
          fi
