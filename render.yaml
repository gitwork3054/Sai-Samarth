services:
  - type: web
    name: sai-samarth-holidays
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sai-samarth-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: sai-samarth-db
    plan: free
